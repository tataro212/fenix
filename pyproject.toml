[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fenix-document"
version = "0.2.0"
description = "Structure-preserving PDF translation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
translation = ["google-genai>=1.0"]
docx = ["python-docx>=1.1", "docx2pdf>=0.1.8"]
layout = ["numpy>=1.24", "Pillow>=10", "torch>=2.0", "ultralytics>=8.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
fenix = "fenix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

